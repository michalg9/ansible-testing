- hosts: all

  tasks:
  - name: Check available disk space on / (fail if less than 10GB available)
    command: df -h / | awk 'NR==2 {print $4}'
    register: disk_space
    changed_when: false
    failed_when: disk_space.stdout | regex_replace('G','') | float < 10.0

  - name: include webserver role
    become: true
    include_role: 
      name: "webserver"

  - name: include geerlingguy.java role
    become: true
    include_role: 
      name: geerlingguy.java

  - name: Touch a file, using symbolic modes to set the permissions (equivalent to 0644)
    become: true
    ansible.builtin.file:
      path: /etc/foo.conf
      state: touch
      mode: u=rw,g=r,o=r
  - name: Touch the other file, add other permissions
    become: true
    ansible.builtin.file:
      path: /etc/foo2.conf
      state: touch
      mode: u+rw,g-wx,o-rwx
  - name: Install apache httpd  (state=present is optional)
    become: true
    ansible.builtin.apt:
      name: apache2
      update_cache: yes
      state: present

