- hosts: all
  vars:
    disk_space_threshold: 10  # Default value of 10GB

  tasks:
  - name: "Check available disk space on / (fail when it's less than {{ disk_space_threshold }} GB)"
    shell: df -h / | awk 'NR==2 {print $4}'
    register: disk_space
    changed_when: false
    when: not ansible_check_mode

  - name: "Fail if available disk space is less than {{ disk_space_threshold }} GB"
    fail:
      msg: "Available disk space on {{ inventory_hostname }} is {{ disk_space.stdout }}. Threshold is {{ disk_space_threshold }} GB."
    when: (disk_space.stdout | regex_replace('G','') | float ) < (disk_space_threshold | float)
    when: not ansible_check_mode
  
  - name: include webserver role
    include_role: 
      name: "webserver"
      apply:
        become: true

  - name: include geerlingguy.java role
    include_role: 
      name: geerlingguy.java
      apply:
        become: true

  - name: Touch a file, using symbolic modes to set the permissions (equivalent to 0644)
    become: true
    ansible.builtin.file:
      path: /etc/foo.conf
      state: touch
      mode: u=rw,g=r,o=r
  - name: Touch the other file, add other permissions
    become: true
    ansible.builtin.file:
      path: /etc/foo2.conf
      state: touch
      mode: u+rw,g-wx,o-rwx
  - name: Install apache httpd  (state=present is optional)
    become: true
    ansible.builtin.apt:
      name: apache2
      update_cache: yes
      state: present

